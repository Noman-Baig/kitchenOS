# coturn configuration for WebRTC voice calls (customer ↔ staff)
# Install: apt install coturn ; copy to /etc/turnserver.conf ; systemctl enable --now coturn
# Open firewall: 3478/udp+tcp, 5349/tcp (TLS), and the relay range 49160-49200/udp.
# The API issues short-lived credentials using TURN_SECRET (must equal static-auth-secret below).

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_SAME_VALUE_AS_TURN_SECRET
realm=turn.example.com
server-name=turn.example.com
total-quota=200
stale-nonce=600
min-port=49160
max-port=49200
# external-ip=PUBLIC_IP/PRIVATE_IP     # required when the server is behind NAT (most cloud VMs)
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# Never relay to private/internal networks (prevents SSRF via TURN)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
log-file=/var/log/turnserver.log
simple-log
